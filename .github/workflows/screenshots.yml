name: Screenshots

# Renders the app (dark mode) and commits the images used in the README.
on:
  push:
    branches: [main]
    paths:
      - web/**
      - scripts/screenshots.js
      - sample_files/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the page
        run: python scripts/build_html.py
      - name: Install Playwright
        working-directory: tests
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Capture
        run: NODE_PATH=tests/node_modules node scripts/screenshots.js docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update screenshots"
          git pull --rebase origin main
          git push origin HEAD:main
