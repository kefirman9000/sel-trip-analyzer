name: Build and release

# Three ways to release version X.Y.Z (VERSION in sel_trip_analyzer.py), all with the notes in docs/releases/vX.Y.Z.md:
#  - Actions -> Build and release -> Run workflow, with "Publish" ticked: builds everything, creates the tag vX.Y.Z
#    on the commit it ran on, and publishes the release;
#  - or push a tag vX.Y.Z: the same;
#  - or publish a release on GitHub by hand: this builds and attaches the files.
# Run without "Publish" it only test-builds (the files are kept as a workflow artifact).
# Installed copies pick the new version up via "Check for updates".
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the VERSION in sel_trip_analyzer.py"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Which release
        id: rel
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, re, sys, subprocess
          v = re.search(r'^VERSION = "([^"]+)"', open("sel_trip_analyzer.py", encoding="utf-8").read(), re.M).group(1)
          tag = "v" + v
          event, ref = os.environ["EVENT"], os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/") and os.environ["GITHUB_REF_NAME"].lstrip("vV") != v:
              sys.exit(f"Tag {os.environ['GITHUB_REF_NAME']} does not match VERSION {v} in sel_trip_analyzer.py")
          publish = event == "push" or (event == "workflow_dispatch" and os.environ.get("PUBLISH") == "true")
          if publish and event == "workflow_dispatch":
              r = subprocess.run(["gh", "release", "view", tag, "--repo", os.environ["GITHUB_REPOSITORY"]], capture_output=True)
              if r.returncode == 0:
                  sys.exit(f"Release {tag} already exists: bump VERSION first")
          notes = f"docs/releases/{tag}.md"
          if not os.path.exists(notes):
              notes = "release-notes.md"
              open(notes, "w", encoding="utf-8").write(f"Release {tag}.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tag={tag}\npublish={'true' if publish else 'false'}\nnotes={notes}\n")
          print(f"{tag}: {'publishing' if publish else 'build only'}")

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests (analysis in Node, launcher in Python)
        run: |
          node --test "tests/*.test.js"
          python -m unittest discover -s tests -v

      - name: Build page, sample files and exe
        run: |
          python -m pip install -r requirements.txt
          python scripts/make_samples.py
          python scripts/build_html.py
          python scripts/make_history_samples.py
          python scripts/build_history.py
          python -m PyInstaller --noconfirm --onefile --windowed --name Relay_Trip_Analyzer --icon assets/icon.ico --add-data "dist/Relay_Trip_Analyzer.html:app" --add-data "sample_files:sample_files" sel_trip_analyzer.py

      - name: Copies under the program's first name (so copies installed before the rename can update)
        shell: pwsh
        run: |
          Copy-Item dist/Relay_Trip_Analyzer.exe dist/SEL_Trip_Analyzer.exe
          Copy-Item dist/Relay_Trip_Analyzer.html dist/SEL_Trip_Analyzer.html

      - name: Self-test the built exe (serves the page, all scripts present, API locked to the page)
        shell: pwsh
        run: |
          $p = Start-Process dist/Relay_Trip_Analyzer.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe self-test exited with $($p.ExitCode)" }
          Write-Host "exe self-test passed"

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.tag }}
          body_path: ${{ steps.rel.outputs.notes }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/Relay_Trip_Analyzer.exe
            dist/Relay_Trip_Analyzer.html
            dist/Relay_Trip_History.html
            Relay_sample_files.zip
            Relay_history_samples.zip
            dist/SEL_Trip_Analyzer.exe
            dist/SEL_Trip_Analyzer.html

      - name: Attach files (release published on GitHub)
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Relay_Trip_Analyzer.exe
            dist/Relay_Trip_Analyzer.html
            dist/Relay_Trip_History.html
            Relay_sample_files.zip
            Relay_history_samples.zip
            dist/SEL_Trip_Analyzer.exe
            dist/SEL_Trip_Analyzer.html

      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relay_Trip_Analyzer
          path: |
            dist/Relay_Trip_Analyzer.exe
            dist/Relay_Trip_Analyzer.html
            dist/Relay_Trip_History.html
            Relay_sample_files.zip
            Relay_history_samples.zip
