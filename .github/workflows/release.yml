name: Build and release

# Publish a GitHub release tagged like v1.0.1 (matching VERSION in
# sel_trip_analyzer.py). This builds SEL_Trip_Analyzer.exe and attaches it to
# that release; installed copies pick it up via "Check for updates".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import re, os, sys
          v = re.search(r'^VERSION = "([^"]+)"', open("sel_trip_analyzer.py", encoding="utf-8").read(), re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          if v != tag:
              sys.exit(f"Tag {tag} does not match VERSION {v} in sel_trip_analyzer.py")

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests (analysis in Node, launcher in Python)
        run: |
          node --test "tests/*.test.js"
          python -m unittest discover -s tests -v

      - name: Build page, sample files and exe
        run: |
          python -m pip install -r requirements.txt
          python scripts/make_samples.py
          python scripts/build_html.py
          python scripts/make_history_samples.py
          python scripts/build_history.py
          python -m PyInstaller --noconfirm --onefile --windowed --name SEL_Trip_Analyzer --icon assets/icon.ico --add-data "dist/SEL_Trip_Analyzer.html:app" --add-data "sample_files:sample_files" sel_trip_analyzer.py

      - name: Self-test the built exe (serves the page, all scripts present, API locked to the page)
        shell: pwsh
        run: |
          $p = Start-Process dist/SEL_Trip_Analyzer.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe self-test exited with $($p.ExitCode)" }
          Write-Host "exe self-test passed"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SEL_Trip_Analyzer.exe
            dist/SEL_Trip_Analyzer.html
            dist/SEL_Trip_History.html
            SEL_sample_files.zip
            SEL_history_samples.zip

      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEL_Trip_Analyzer
          path: |
            dist/SEL_Trip_Analyzer.exe
            dist/SEL_Trip_Analyzer.html
            dist/SEL_Trip_History.html
            SEL_sample_files.zip
            SEL_history_samples.zip
