name: Build and release

# Publish a GitHub release tagged like v1.0.1 (matching VERSION in
# sel_trip_analyzer.py). This builds SEL_Trip_Analyzer.exe and attaches it to
# that release; installed copies pick it up via "Check for updates".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import re, os, sys
          v = re.search(r'^VERSION = "([^"]+)"', open("sel_trip_analyzer.py", encoding="utf-8").read(), re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          if v != tag:
              sys.exit(f"Tag {tag} does not match VERSION {v} in sel_trip_analyzer.py")

      - name: Build exe
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name SEL_Trip_Analyzer --collect-all tkinterdnd2 --collect-data sv_ttk --collect-data docx --collect-all reportlab --hidden-import olefile --icon assets/icon.ico --add-data "assets/icon.ico:assets" --add-data "assets/icon.png:assets" --add-data "sample_files:sample_files" sel_trip_analyzer.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the built exe (parse + Word/PDF export)
        shell: pwsh
        run: |
          $p = Start-Process dist/SEL_Trip_Analyzer.exe -ArgumentList '--cli','sample_files','--out','smoke.docx','--out','smoke.pdf' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          foreach ($f in 'smoke.docx','smoke.pdf') {
            if (-not (Test-Path $f) -or (Get-Item $f).Length -lt 2000) { throw "$f missing or empty" }
          }
          Write-Host "exe exported smoke.docx and smoke.pdf"

      - name: Build sample files zip
        run: python scripts/make_samples.py

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SEL_Trip_Analyzer.exe
            SEL_sample_files.zip

      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEL_Trip_Analyzer
          path: |
            dist/SEL_Trip_Analyzer.exe
            SEL_sample_files.zip
