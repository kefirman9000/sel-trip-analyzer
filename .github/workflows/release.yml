name: Build and release

# Two ways to release (the tag must match VERSION in sel_trip_analyzer.py):
#  - push a tag like v2.1.0: this builds everything and publishes the release,
#    with the notes from docs/releases/v2.1.0.md (if that file exists);
#  - or publish a release on GitHub by hand: this builds and attaches the files.
# Installed copies pick the new version up via "Check for updates".
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import re, os, sys
          v = re.search(r'^VERSION = "([^"]+)"', open("sel_trip_analyzer.py", encoding="utf-8").read(), re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          if v != tag:
              sys.exit(f"Tag {tag} does not match VERSION {v} in sel_trip_analyzer.py")

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests (analysis in Node, launcher in Python)
        run: |
          node --test "tests/*.test.js"
          python -m unittest discover -s tests -v

      - name: Build page, sample files and exe
        run: |
          python -m pip install -r requirements.txt
          python scripts/make_samples.py
          python scripts/build_html.py
          python scripts/make_history_samples.py
          python scripts/build_history.py
          python -m PyInstaller --noconfirm --onefile --windowed --name SEL_Trip_Analyzer --icon assets/icon.ico --add-data "dist/SEL_Trip_Analyzer.html:app" --add-data "sample_files:sample_files" sel_trip_analyzer.py

      - name: Self-test the built exe (serves the page, all scripts present, API locked to the page)
        shell: pwsh
        run: |
          $p = Start-Process dist/SEL_Trip_Analyzer.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe self-test exited with $($p.ExitCode)" }
          Write-Host "exe self-test passed"

      - name: Release notes for a pushed tag
        id: notes
        if: github.event_name == 'push'
        shell: python
        run: |
          import os
          tag = os.environ["GITHUB_REF_NAME"]
          path = f"docs/releases/{tag}.md"
          if not os.path.exists(path):
              path = "release-notes.md"
              open(path, "w", encoding="utf-8").write(f"Release {tag}.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"path={path}\n")

      - name: Publish release (pushed tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/SEL_Trip_Analyzer.exe
            dist/SEL_Trip_Analyzer.html
            dist/SEL_Trip_History.html
            SEL_sample_files.zip
            SEL_history_samples.zip

      - name: Attach files (release published on GitHub)
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SEL_Trip_Analyzer.exe
            dist/SEL_Trip_Analyzer.html
            dist/SEL_Trip_History.html
            SEL_sample_files.zip
            SEL_history_samples.zip

      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEL_Trip_Analyzer
          path: |
            dist/SEL_Trip_Analyzer.exe
            dist/SEL_Trip_Analyzer.html
            dist/SEL_Trip_History.html
            SEL_sample_files.zip
            SEL_history_samples.zip
