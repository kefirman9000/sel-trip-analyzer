name: Website

# Publishes the browser version to GitHub Pages (https://<owner>.github.io/<repo>/).
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until that's done this workflow just skips the deploy.
on:
  push:
    branches: [main]
    paths:
      - web/**
      - sel_trip_analyzer.py
      - sample_files/**
      - assets/**
      - scripts/build_html.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages isn't turned on yet (Settings -> Pages -> Source: GitHub Actions). Skipping deploy."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          python scripts/build_html.py site/index.html
          cp site/index.html site/SEL_Trip_Analyzer.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
