name: Website

# Keeps the gh-pages branch (the published browser version) in step with main.
# GitHub Pages serves that branch: Settings -> Pages -> Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root).
on:
  push:
    branches: [main]
    paths:
      - web/**
      - sel_trip_analyzer.py
      - sample_files/**
      - assets/**
      - scripts/build_html.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        run: python scripts/build_html.py "$RUNNER_TEMP/index.html"
      - name: Update gh-pages branch
        run: |
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/site" origin/gh-pages
          cd "$RUNNER_TEMP/site"
          cp "$RUNNER_TEMP/index.html" index.html
          cp index.html SEL_Trip_Analyzer.html
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "Website already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish browser version from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
