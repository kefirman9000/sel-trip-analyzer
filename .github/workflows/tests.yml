name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Analysis tests (web/*.js)
        run: node --test "tests/*.test.js"
      - name: Desktop launcher tests
        run: python -m unittest discover -s tests -v
      - name: Sample report from the command line
        run: node web/cli.js sample_files > sample_report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: sample_report.txt

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the page
        run: python scripts/build_html.py
      - name: Install Playwright
        working-directory: tests
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: End-to-end test in Chromium
        run: node tests/browser_test.js screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-version
          path: |
            dist/Relay_Trip_Analyzer.html
            screenshots/
