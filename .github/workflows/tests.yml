name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install olefile python-docx reportlab
      - run: python -m unittest discover -s tests -v
      - name: Export sample report
        run: python sel_trip_analyzer.py --cli sample_files --out sample_report.docx --out sample_report.pdf > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: sample_report.*
