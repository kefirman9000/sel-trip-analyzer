<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEL Trip History</title>
<meta name="description" content="Load SEL relay event files from many stations and dates; see recurring issues, trends and the worst locations. Runs entirely in your browser.">
<link rel="icon" type="image/png" href="{{ICON}}">
<style>
:root {
  --bg: #fafafa; --surface: #ffffff; --surface-2: #f3f3f3; --text: #1b1b1b; --muted: #616161;
  --border: #d9d9d9; --accent: #005fb8; --accent-hover: #0a6cc7; --on-accent: #ffffff;
  --drop: #f4f8fd; --drop-hover: #e3eefb; --drop-line: #9fb9d9; --sel: #cce4f7;
  --trip: #c42b1c; --ok: #0f7b0f; --warn: #9a5800; --rule: #c9c9c9; --shadow: 0 8px 28px rgba(0,0,0,.14);
  --c-fault: #005fb8; --c-nofault: #c27c0e; --c-other: #a0a0a0; --heat: 196, 43, 28;
  --pA: #c42b1c; --pB: #1b1b1b; --pC: #005fb8; --pX: #8a8a8a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1c; --surface: #252525; --surface-2: #2c2c2c; --text: #e9e9e9; --muted: #9e9e9e;
    --border: #3a3a3a; --accent: #4cc2ff; --accent-hover: #6dccff; --on-accent: #000000;
    --drop: #20262d; --drop-hover: #22344a; --drop-line: #4d6a8b; --sel: #264f78;
    --trip: #ff8f85; --ok: #6ccb5f; --warn: #ffb74d; --rule: #474747; --shadow: 0 8px 28px rgba(0,0,0,.5);
    --c-fault: #4cc2ff; --c-nofault: #ffb74d; --c-other: #6e6e6e; --heat: 255, 143, 133;
    --pA: #ff8f85; --pB: #e9e9e9; --pC: #4cc2ff; --pX: #8a8a8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1c; --surface: #252525; --surface-2: #2c2c2c; --text: #e9e9e9; --muted: #9e9e9e;
  --border: #3a3a3a; --accent: #4cc2ff; --accent-hover: #6dccff; --on-accent: #000000;
  --drop: #20262d; --drop-hover: #22344a; --drop-line: #4d6a8b; --sel: #264f78;
  --trip: #ff8f85; --ok: #6ccb5f; --warn: #ffb74d; --rule: #474747; --shadow: 0 8px 28px rgba(0,0,0,.5);
  --c-fault: #4cc2ff; --c-nofault: #ffb74d; --c-other: #6e6e6e; --heat: 255, 143, 133;
  --pA: #ff8f85; --pB: #e9e9e9; --pC: #4cc2ff; --pX: #8a8a8a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--sel); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 18px 22px 40px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
header img { width: 42px; height: 42px; flex: none; }
.titles { flex: 1 1 260px; min-width: 0; }
h1 { font: 600 22px/1.2 "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin-top: 2px; }
.plainsw { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; color: var(--text); }
.plainsw input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
#themeBtn { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; min-height: 32px; cursor: pointer; }
#themeBtn:hover { background: var(--surface-2); }
#print-root { display: none; }
@media print {
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block; color: #000; font: 10.5pt/1.35 Calibri, "Segoe UI", Arial, sans-serif; }
}
@media (max-width: 560px) { .wrap { padding: 12px 12px 30px; } }
/*{{HISTORY_CSS}}*/
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="{{ICON}}" alt="">
    <div class="titles">
      <h1>SEL Trip History</h1>
      <div class="sub">Every trip you've loaded, by location: what keeps happening, what's getting worse, and where to look first.</div>
    </div>
    <label class="plainsw" title="Say things in everyday words instead of relay codes and engineering terms"><input type="checkbox" id="plainSw"> Plain English</label>
    <button id="themeBtn" title="Dark / light (Ctrl+D)" aria-label="Dark or light mode"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
  </header>
  <div id="history"></div>
</div>
<div id="print-root"></div>

<script id="sample-data" type="application/json">{{SAMPLES_JSON}}</script>
<script>
/*{{CORE_JS}}*/
</script>
<script>
/*{{ANALYSIS_JS}}*/
</script>
<script>
/*{{DOCX_JS}}*/
</script>
<script>
/*{{WEATHER_JS}}*/
</script>
<script>
/*{{PLAIN_JS}}*/
</script>
<script>
/*{{HISTORY_JS}}*/
</script>
<script>
/*{{HISTORY_UI_JS}}*/
</script>
<script>
(function () {
"use strict";
const PAGE_SOURCE = "<!doctype html>\n" + document.documentElement.outerHTML;   // for snapshots, before anything is drawn
const prefs = {
  get(k, d) { try { const v = localStorage.getItem("sel-history:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sel-history:" + k, JSON.stringify(v)); } catch (e) { /* unavailable */ } },
};
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
applyTheme(prefs.get("theme", ""));
function toggleTheme() {
  const el = document.documentElement;
  const dark = el.getAttribute("data-theme") === "dark" || (!el.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const t = dark ? "light" : "dark"; applyTheme(t); prefs.set("theme", t);
}
document.getElementById("themeBtn").onclick = toggleTheme;
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "d") { e.preventDefault(); toggleTheme(); } });
const app = window.SELHistoryUI.mount(document.getElementById("history"), {
  version: "{{VERSION}}", repo: "{{REPO}}", printRoot: document.getElementById("print-root"),
  samples: () => JSON.parse(document.getElementById("sample-data").textContent || "[]"),
  pageSource: PAGE_SOURCE,
  snapshot: (() => { const el = document.getElementById("hx-snapshot"); try { return el ? JSON.parse(el.textContent) : null; } catch (e) { return null; } })(),
});
window.SELHistoryApp = app;   // for tests
// Plain English / engineering wording (shared with the Trip Analyzer in this browser)
const shared = { get(k, d) { try { const v = localStorage.getItem("sel-trip:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                 set(k, v) { try { localStorage.setItem("sel-trip:" + k, JSON.stringify(v)); } catch (e) { /* unavailable */ } } };
const sw = document.getElementById("plainSw");
const snapEl = document.getElementById("hx-snapshot");
let snapPlain = false; try { snapPlain = snapEl ? !!JSON.parse(snapEl.textContent).plain : false; } catch (e) { /* none */ }
sw.checked = shared.get("plain", snapPlain);
sw.onchange = () => { shared.set("plain", sw.checked); app.plainChanged(); };
})();
</script>
</body>
</html>
